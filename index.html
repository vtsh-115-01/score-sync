<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成績輸入與加權排名系統</title>
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      background-color: #fafafa;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .instruction-card {
      background-color: #eef6ff;
      border-left: 4px solid #2196F3;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
    }
    .field {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }
    label {
      width: 100px;
      font-weight: bold;
      color: #555;
    }
    input[type="number"] {
      width: 140px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 9px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
      width: 100%;
    }
    button:hover {
      background-color: #45a049;
    }
    .error {
      color: #d32f2f;
      font-weight: bold;
      margin-top: 10px;
    }
    .success {
      color: #2e7d32;
      background-color: #e8f5e9;
      padding: 12px;
      border-radius: 4px;
      margin-top: 15px;
    }
    #score-form {
      display: none;
      margin-top: 20px;
    }
    #user-info {
      margin-bottom: 15px;
      font-weight: bold;
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <h2>成績登記系統</h2>

  <!-- 登入前使用說明 -->
  <div id="instruction-before" class="instruction-card">
    📌 <strong>使用說明：</strong><br>
    請先點擊下方按鈕以 Google 帳號登入。登入後即可輸入或修改各科成績並即時計算加權平均與排名。
  </div>

  <!-- Google 登入按鈕容器 -->
  <div id="signin-container">
    <div id="g_id_onload"
         data-client_id="422522661354-pooujtllshgd9q419ov1cgoutlfkgd92.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
  </div>

  <div id="user-info"></div>

  <!-- 登入後使用說明 -->
  <div id="instruction-after" class="instruction-card" style="display: none;">
    📌 <strong>填寫說明：</strong>
    <ul style="margin: 5px 0 0 18px; padding: 0;">
      <li><strong>加權方式：</strong>國、數、英加權 4；物、生、歷、地加權 2。</li>
      <li><strong>彈性輸入：</strong>若某科未考或無成績，請保持空白，系統將自動不採計該科加權。</li>
      <li>若您先前已登錄過資料，下方已自動載入您的歷史紀錄，可直接修改後點擊送出。</li>
    </ul>
  </div>

  <div id="message-box" class="error"></div>

  <!-- 七科成績輸入表單 (未填則不加權) -->
  <form id="score-form" onsubmit="submitScores(event)">
    <h3>請輸入/修改各科成績：</h3>
    <div class="field"><label>國文：</label><input type="number" id="chinese" min="0" max="100" placeholder="未輸入則不計"></div>
    <div class="field"><label>數學：</label><input type="number" id="math" min="0" max="100" placeholder="未輸入則不計"></div>
    <div class="field"><label>英文：</label><input type="number" id="english" min="0" max="100" placeholder="未輸入則不計"></div>
    <div class="field"><label>物理：</label><input type="number" id="physics" min="0" max="100" placeholder="未輸入則不計"></div>
    <div class="field"><label>生物：</label><input type="number" id="biology" min="0" max="100" placeholder="未輸入則不計"></div>
    <div class="field"><label>歷史：</label><input type="number" id="history" min="0" max="100" placeholder="未輸入則不計"></div>
    <div class="field"><label>地理：</label><input type="number" id="geography" min="0" max="100" placeholder="未輸入則不計"></div>
    
    <button type="submit">儲存成績並計算排名</button>
  </form>

  <!-- 結果顯示區 -->
  <div id="result-box"></div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwQbeZGOGHEq5hLEA_gwNUXEFDGiUcjaYDI4ei3ZQ5QrfP6aK2V3DjB50CYZKwmujEG/exec";
    let currentUserEmail = "";
    let currentUserName = "";

    const subjects = ["chinese", "math", "english", "physics", "biology", "history", "geography"];

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    // 登入完成回調
    async function handleCredentialResponse(response) {
      const responsePayload = parseJwt(response.credential);
      currentUserEmail = responsePayload.email;
      currentUserName = responsePayload.name || "使用者";
      
      // 隱藏登入按鈕與登入前說明，切換顯示登入後介面
      document.getElementById("signin-container").style.display = "none";
      document.getElementById("instruction-before").style.display = "none";
      document.getElementById("instruction-after").style.display = "block";
      document.getElementById("user-info").innerText = `已登入帳號：${currentUserName} (${currentUserEmail})`;
      
      document.getElementById("message-box").innerText = "正在檢查並載入歷史成績紀錄...";

      // 向後端查詢是否有舊資料
      await fetchUserData(currentUserEmail);
    }

    // 載入使用者歷史資料
    async function fetchUserData(email) {
      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getUserData", email: email })
        });
        const data = await res.json();

        document.getElementById("message-box").innerText = "";
        document.getElementById("score-form").style.display = "block";

        if (data.exists && data.scores) {
          // 自動帶入舊有數據
          subjects.forEach((subjId, idx) => {
            const val = data.scores[idx];
            document.getElementById(subjId).value = (val !== "" && val !== null && val !== undefined) ? val : "";
          });
          document.getElementById("message-box").innerText = "已為您自動載入歷史紀錄，可直接修改後儲存。";
          document.getElementById("message-box").className = "success";
        }
      } catch (err) {
        document.getElementById("message-box").className = "error";
        document.getElementById("message-box").innerText = "載入歷史資料失敗，您可以直接重新填寫。";
        document.getElementById("score-form").style.display = "block";
      }
    }

    // 送出成績
    async function submitScores(e) {
      e.preventDefault();
      if (!currentUserEmail) {
        alert("請先登入 Google 帳號！");
        return;
      }

      // 抓取各科分數，留空則傳送 null
      const scores = subjects.map(subjId => {
        const val = document.getElementById(subjId).value.trim();
        return val === "" ? null : Number(val);
      });

      document.getElementById("message-box").className = "error";
      document.getElementById("message-box").innerText = "資料儲存中，請稍候...";
      document.getElementById("result-box").innerText = "";

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "verifyAndSubmit",
            name: currentUserName,
            email: currentUserEmail,
            scores: scores
          })
        });

        const result = await res.json();

        if (result.success) {
          document.getElementById("message-box").innerText = "";
          const avgDisplay = result.weightedAvg !== "" ? result.weightedAvg : "尚無有效採計科目";
          const rankDisplay = result.rank ? `第 ${result.rank} 名` : "無";

          document.getElementById("result-box").innerHTML = `
            <div class="success">
              <p>成績已成功更新！</p>
              <p>加權平均：<strong>${avgDisplay}</strong></p>
              <p>班級排名（J欄）：<strong>${rankDisplay}</strong></p>
            </div>
          `;
        } else {
          document.getElementById("message-box").innerText = "寫入失敗：" + result.message;
        }
      } catch (err) {
        document.getElementById("message-box").innerText = "連線失敗：" + err.message;
      }
    }
  </script>
</body>
</html>
