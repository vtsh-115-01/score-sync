<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成績輸入與加權排名系統</title>
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    .field { margin-bottom: 15px; }
    label { display: inline-block; width: 80px; }
    input[type="number"] { width: 120px; padding: 5px; }
    .error { color: red; font-weight: bold; margin-top: 10px; }
    .success { color: green; font-weight: bold; margin-top: 10px; }
    #score-form { display: none; margin-top: 20px; }
  </style>
</head>
<body>

  <h2>成績登記系統</h2>

  <!-- 1. Google 登入按鈕 (請記得換上您的 Google Client ID) -->
  <div id="g_id_onload"
       data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <div id="user-info"></div>
  <div id="message-box" class="error"></div>

  <!-- 2. 七科成績輸入表單 -->
  <form id="score-form" onsubmit="submitScores(event)">
    <h3>請輸入各科成績：</h3>
    <div class="field"><label>國文：</label><input type="number" id="chinese" min="0" max="100" required></div>
    <div class="field"><label>數學：</label><input type="number" id="math" min="0" max="100" required></div>
    <div class="field"><label>英文：</label><input type="number" id="english" min="0" max="100" required></div>
    <div class="field"><label>物理：</label><input type="number" id="physics" min="0" max="100" required></div>
    <div class="field"><label>生物：</label><input type="number" id="biology" min="0" max="100" required></div>
    <div class="field"><label>歷史：</label><input type="number" id="history" min="0" max="100" required></div>
    <div class="field"><label>地理：</label><input type="number" id="geography" min="0" max="100" required></div>
    
    <button type="submit">計算並送出</button>
  </form>

  <!-- 5. 結果顯示區 -->
  <div id="result-box"></div>

  <script>
    // 已更新為您的 Apps Script 網頁應用程式 URL
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwQbeZGOGHEq5hLEA_gwNUXEFDGiUcjaYDI4ei3ZQ5QrfP6aK2V3DjB50CYZKwmujEG/exec";
    let currentUserEmail = "";

    // JWT 解析
    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    // Google 登入完成回調
    function handleCredentialResponse(response) {
      const responsePayload = parseJwt(response.credential);
      currentUserEmail = responsePayload.email;
      
      document.getElementById("user-info").innerText = "已登入帳號：" + currentUserEmail;
      document.getElementById("score-form").style.display = "block";
      document.getElementById("message-box").innerText = "";
    }

    // 送出成績
    async function submitScores(e) {
      e.preventDefault();
      if (!currentUserEmail) {
        alert("請先登入 Google 帳號！");
        return;
      }

      const scores = [
        Number(document.getElementById("chinese").value),
        Number(document.getElementById("math").value),
        Number(document.getElementById("english").value),
        Number(document.getElementById("physics").value),
        Number(document.getElementById("biology").value),
        Number(document.getElementById("history").value),
        Number(document.getElementById("geography").value)
      ];

      document.getElementById("message-box").innerText = "處理中...";
      document.getElementById("result-box").innerText = "";

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "verifyAndSubmit",
            email: currentUserEmail,
            scores: scores
          })
        });

        const result = await res.json();

        if (!result.authorized) {
          document.getElementById("message-box").innerText = result.message;
        } else if (result.success) {
          document.getElementById("message-box").innerText = "";
          document.getElementById("result-box").innerHTML = `
            <div class="success">
              <p>成績已成功寫入！</p>
              <p>加權平均：<strong>${result.weightedAvg}</strong></p>
              <p>班級排名（J欄）：<strong>第 ${result.rank} 名</strong></p>
            </div>
          `;
        }
      } catch (err) {
        document.getElementById("message-box").innerText = "連線失敗：" + err.message;
      }
    }
  </script>
</body>
</html>
